[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sisyphus"
version = "0.1.0"
description = "Esparza SPS angular distribution pipeline"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "polars",
    "matplotlib",
    "pyyaml",
    "odfpy"
]

[tool.setuptools.packages.find]
where = ["src"]
